[package]
name = "siela-tts"
version = "0.1.1"
edition = "2021"

[lib]
name = "siela_tts"
path = "src/lib.rs"

[[bin]]
name = "siela-tts"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.15"
ndarray = "0.17"
zip = "2"
hound = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
bytes = "1"
libc = "0.2"
futures-util = "0.3"
async-stream = "0.3"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
