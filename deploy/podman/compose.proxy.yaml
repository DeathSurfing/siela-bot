# Optional override: external TLS proxy for clients outside the Podman network.
#
# Use only when MCP must be reachable from outside:
#   podman compose -p siela \
#     -f deploy/podman/compose.yaml \
#     -f deploy/podman/compose.proxy.yaml up -d
#
# Then set MCP_URL to the HTTPS URL in deploy/podman/.env.

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: siela-caddy
    networks: [mcp, edge]
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
