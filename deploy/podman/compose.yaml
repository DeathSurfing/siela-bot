# Siela Bot — Podman Compose stack
#
# Kept to the compose subset that works with both `podman compose`
# (Docker Compose provider) and `podman-compose`.
# No top-level `name`, no `profiles`, no `deploy`, no `secrets`,
# no `build.target`, and no `depends_on.condition`.
#
# MCP is optional and lives in compose.mcp.yaml. Use the stack wrapper:
#   scripts/podman-stack.sh up -d
# or compose explicitly:
#   podman compose -p siela -f deploy/podman/compose.yaml up -d
# Use `-p siela` so network names are deterministic: siela_edge,
# siela_data, siela_control (and siela_mcp when MCP is enabled).

networks:
  edge:
  data:
    internal: true
  control:
    internal: true

volumes:
  pgdata:
  translator_models:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: siela-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siela -d siela"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  migrate:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    env_file: .env
    networks: [data]
    depends_on:
      - postgres
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]

  translator:
    image: localhost/siela-translator:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.translator
    container_name: siela-translator
    environment:
      TRANSLATOR_MODEL: facebook/nllb-200-distilled-600M
      TRANSLATOR_THREADS: "4"
      TRANSLATOR_BEAMS: "4"
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - translator_models:/models
    networks: [edge]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 180s
    mem_limit: 4g

  bot:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    container_name: siela-bot
    env_file: .env
    networks:
      edge:
      data:
      control:
        aliases: [bot-control]
    depends_on:
      - postgres
      - migrate
      - translator
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g


