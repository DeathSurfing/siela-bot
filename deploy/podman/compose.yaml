# Siela Bot — Podman Compose stack
#
# Kept to the compose subset that works with both `podman compose`
# (Docker Compose provider) and `podman-compose`.
# No top-level `name`, no `profiles`, no `deploy`, no `secrets`,
# no `build.target`, and no `depends_on.condition`.
#
# MCP is optional and lives in compose.mcp.yaml. Use the stack wrapper:
#   scripts/podman-stack.sh up -d
# or compose explicitly:
#   podman compose -p siela -f deploy/podman/compose.yaml up -d
# Use `-p siela` so network names are deterministic: siela_edge,
# siela_data, siela_control (and siela_mcp when MCP is enabled).

networks:
  edge:
  data:
    internal: true
  control:
    internal: true

volumes:
  pgdata:
  llmcache:
  valkeydata:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: siela-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siela -d siela"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: siela-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: siela-llm
    networks: [edge, control]
    volumes:
      - llmcache:/root/.cache/huggingface
      - /opt/nvidia-libs:/opt/nvidia-libs:ro
    environment:
      LD_LIBRARY_PATH: /opt/nvidia-libs
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    command:
      - "--hf-repo"
      - "Goekdeniz-Guelmez/Josiefied-Qwen2.5-1.5B-Instruct-abliterated-v3-gguf"
      - "--hf-file"
      - "josiefied-qwen2.5-1.5b-instruct-abliterated-v3.Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "99"
      - "-c"
      - "2048"
    restart: unless-stopped
    mem_limit: 2g

  migrate:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    env_file: .env
    networks: [data]
    depends_on:
      - postgres
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]

  bot:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    container_name: siela-bot
    env_file: .env
    networks:
      edge:
      data:
      control:
        aliases: [bot-control]
    depends_on:
      - postgres
      - migrate
      - llm
      - valkey
    environment:
      LLM_URL: ${LLM_URL:-http://llm:8080}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 8g


