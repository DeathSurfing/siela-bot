# Siela Bot — Podman Compose stack
#
# Kept to the compose subset that works with both `podman compose`
# (Docker Compose provider) and `podman-compose`.
# No top-level `name`, no `profiles`, no `deploy`, no `secrets`,
# no `build.target`, and no `depends_on.condition`.
#
# MCP is optional and lives in compose.mcp.yaml. Use the stack wrapper:
#   scripts/podman-stack.sh up -d
# or compose explicitly:
#   podman compose -p siela -f deploy/podman/compose.yaml up -d
# Use `-p siela` so network names are deterministic: siela_edge,
# siela_data, siela_control (and siela_mcp when MCP is enabled).

networks:
  edge:
  data:
    internal: true
  control:
    internal: true

volumes:
  pgdata:
  libretranslate_models:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: siela-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siela -d siela"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  migrate:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    env_file: .env
    networks: [data]
    depends_on:
      - postgres
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: siela-libretranslate
    environment:
      LT_LOAD_ONLY: en,es,fr,de,hi,ko
      # Set LT_UPDATE_MODELS=true temporarily after adding a language.
      LT_UPDATE_MODELS: "${LT_UPDATE_MODELS:-false}"
      LT_DISABLE_WEB_UI: "true"
      LT_CHAR_LIMIT: "2000"
      LT_REQ_LIMIT: "60"
      LT_THREADS: "2"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    mem_limit: 2g

  bot:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    container_name: siela-bot
    env_file: .env
    networks:
      edge:
      data:
      control:
        aliases: [bot-control]
    depends_on:
      - postgres
      - migrate
      - libretranslate
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g


