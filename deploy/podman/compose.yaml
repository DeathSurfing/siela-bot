# Siela Bot — Podman Compose stack
#
# Kept to the compose subset that works with both `podman compose`
# (Docker Compose provider) and `podman-compose`.
# No top-level `name`, no `profiles`, no `deploy`, no `secrets`,
# no `build.target`, and no `depends_on.condition`.
#
# Use the stack wrapper:
#   scripts/podman-stack.sh up -d
# or compose explicitly:
#   podman compose -p siela -f deploy/podman/compose.yaml up -d
# Use `-p siela` so network names are deterministic: siela_edge,
# siela_data, siela_control.

networks:
  edge:
  data:
    internal: true
  control:
    internal: true

volumes:
  pgdata:
  llmcache:
  valkeydata:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: siela-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siela -d siela"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: siela-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  llm:
    # Needs a driver that supports CUDA 12.8 (550 or newer; verified on 595).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: siela-llm
    networks: [edge, control]
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
    volumes:
      # Whole cache dir so both the Hugging Face and llama.cpp caches persist.
      - llmcache:/root/.cache
      # Driver libraries come from the host; podman has no CDI spec here.
      - /opt/nvidia-libs:/usr/local/nvidia/lib64:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64
    command:
      - "--hf-repo"
      - "DeathSurfing/tinyTanLLM-delulu-gemma"
      - "--hf-file"
      - "delulu-gemma-q4_k_m.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "-c"
      - "1024"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      # KV quantization on CUDA needs flash attention.
      - "-fa"
      - "on"
      # Keep the weights in VRAM so system RAM stays free.
      - "-ngl"
      - "99"
      # N-gram self-speculation speeds decoding without a draft model.
      - "--spec-type"
      - "ngram-simple"
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      # The image inherits a check against :8080; this server runs on :8000.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  tts:
    image: localhost/siela-tts:latest
    build:
      context: ../..
      dockerfile: services/tts/Containerfile
    container_name: siela-tts
    networks: [data]
    environment:
      # KITTEN_TTS_MODEL selects baked-in weights (image build arg).
      TTS_VOICE: Bruno
      TTS_SPEED: "1.0"
    restart: unless-stopped
    mem_limit: 1g

  migrate:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    env_file: .env
    networks: [data]
    depends_on:
      - postgres
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]

  bot:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    container_name: siela-bot
    env_file: .env
    networks:
      edge:
      data:
      control:
        aliases: [bot-control]
    depends_on:
      - postgres
      - migrate
      - llm
      - valkey
      - tts
    environment:
      LLM_URL: ${LLM_URL:-http://llm:8000}
      LLM_MODEL: ${LLM_MODEL:-DeathSurfing/tinyTanLLM-delulu-gemma}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      TTS_SERVICE_URL: ${TTS_SERVICE_URL:-http://tts:8000}
      TTS_STREAM: "true"
      NODE_ROLE: commander
      NODE_ID: commander
      NODE_ADVERTISE_URL: http://bot-control:3101
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 8g

  # Voice fleet gateway. Single HTTP entrypoint for music across N nodes:
  # POST /v1/music/<op> with {"nodeId": ...} fans out to that node's
  # internal worker API; everything else proxies to the commander.
  # NODES lists every node including the commander, e.g.
  # NODES=commander=http://bot-control:3101,voice-1=http://bot-voice-1:3101
  router:
    image: localhost/siela-router:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.router
    container_name: siela-router
    env_file: .env
    networks:
      control:
        aliases: [voice-router]
      data:
    depends_on:
      - bot
      - valkey
    environment:
      COMMANDER_URL: ${COMMANDER_URL:-http://bot-control:3001}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      NODES: ${NODES:-commander=http://bot-control:3101}
      ROUTER_PORT: 3100
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 128m


