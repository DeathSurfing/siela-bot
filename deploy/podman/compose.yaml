# Siela Bot — Podman Compose stack
#
# Kept to the compose subset that works with both `podman compose`
# (Docker Compose provider) and `podman-compose`.
# No top-level `name`, no `profiles`, no `deploy`, no `secrets`,
# no `build.target`, and no `depends_on.condition`.
#
# MCP is optional and lives in compose.mcp.yaml. Use the stack wrapper:
#   scripts/podman-stack.sh up -d
# or compose explicitly:
#   podman compose -p siela -f deploy/podman/compose.yaml up -d
# Use `-p siela` so network names are deterministic: siela_edge,
# siela_data, siela_control (and siela_mcp when MCP is enabled).

networks:
  edge:
  data:
    internal: true
  control:
    internal: true

volumes:
  pgdata:
  llmcache:
  ttscache:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: siela-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siela -d siela"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: siela-llm
    networks: [edge, control]
    volumes:
      - llmcache:/root/.cache/huggingface
    command:
      - "--hf-repo"
      - "mradermacher/Qwen3-0.6B-heretic-abliterated-uncensored-GGUF"
      - "--hf-file"
      - "Qwen3-0.6B-heretic-abliterated-uncensored.Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
    restart: unless-stopped
    mem_limit: 1g

  tts:
    image: localhost/siela-tts:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.tts
    container_name: siela-tts
    networks: [edge, control]
    volumes:
      - ttscache:/root/.cache/huggingface
    restart: unless-stopped
    mem_limit: 2g

  migrate:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    env_file: .env
    networks: [data]
    depends_on:
      - postgres
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]

  bot:
    image: localhost/siela-bot:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.bot
    container_name: siela-bot
    env_file: .env
    networks:
      edge:
      data:
      control:
        aliases: [bot-control]
    depends_on:
      - postgres
      - migrate
      - llm
      - tts
    environment:
      LLM_URL: ${LLM_URL:-http://llm:8080}
      TTS_URL: ${TTS_URL:-http://tts:8000}
      TTS_VOICES_DIR: /app/voices
    volumes:
      - ./voices:/app/voices:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g


