# Optional watchtower overlay: auto-deploy `main` from GitHub.
#
# The watchtower container needs three host resources:
#   - the checkout, mounted at the same absolute path it has on the host so
#     host-side `podman build` resolves build contexts;
#   - the rootful Podman socket, so it can build and recreate containers;
#   - a state volume for the last deployed SHA.
#
# Enable with the stack wrapper:
#   WATCHTOWER_ENABLED=true scripts/podman-stack.sh up -d
#
# WATCHTOWER_REPO_DIR is required and must be the absolute host path of this
# checkout (for example /root/siela-nogseuui-seobeo-bot).
#
# Security: the socket is root-equivalent access to the host. Only enable this
# against a repository you trust, and prefer HTTPS plus GH_TOKEN over SSH keys.

volumes:
  watchtower-state:
  watchtower-node-modules:

services:
  watchtower:
    image: localhost/siela-watchtower:latest
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile.watchtower
    container_name: siela-watchtower
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${WATCHTOWER_LOG_LEVEL:-info}
      WATCHTOWER_REPO_URL: ${WATCHTOWER_REPO_URL:-https://github.com/DeathSurfing/siela-nogseuui-seobeo-bot.git}
      WATCHTOWER_BRANCH: ${WATCHTOWER_BRANCH:-main}
      WATCHTOWER_REPO_DIR: ${WATCHTOWER_REPO_DIR:?set WATCHTOWER_REPO_DIR to the absolute host path of this checkout}
      WATCHTOWER_INTERVAL_SEC: ${WATCHTOWER_INTERVAL_SEC:-60}
      WATCHTOWER_CI_GATE: ${WATCHTOWER_CI_GATE:-auto}
      WATCHTOWER_CI_GRACE_SEC: ${WATCHTOWER_CI_GRACE_SEC:-180}
      WATCHTOWER_CI_TIMEOUT_SEC: ${WATCHTOWER_CI_TIMEOUT_SEC:-900}
      WATCHTOWER_HEALTH_TIMEOUT_SEC: ${WATCHTOWER_HEALTH_TIMEOUT_SEC:-180}
      WATCHTOWER_BUILD_NETWORK: ${WATCHTOWER_BUILD_NETWORK:-}
      WATCHTOWER_RUN_MIGRATIONS: ${WATCHTOWER_RUN_MIGRATIONS:-true}
      WATCHTOWER_DRY_RUN: ${WATCHTOWER_DRY_RUN:-false}
      WATCHTOWER_STATE_DIR: /state
      WATCHTOWER_HTTP_HOST: 0.0.0.0
      WATCHTOWER_HTTP_PORT: "3003"
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN (scripts/podman-init.sh generates one)}
      WATCHTOWER_NOTIFY_WEBHOOK_URL: ${WATCHTOWER_NOTIFY_WEBHOOK_URL:-}
      GH_TOKEN: ${GH_TOKEN:-}
      CONTAINER_HOST: unix:///run/podman/podman.sock
      HOME: /tmp
      BUN_INSTALL_CACHE_DIR: /state/bun-cache
    networks: [edge]
    volumes:
      - ${WATCHTOWER_REPO_DIR:?}:${WATCHTOWER_REPO_DIR:?}
      - watchtower-state:/state
      - watchtower-node-modules:${WATCHTOWER_REPO_DIR:?}/node_modules
      - /run/podman/podman.sock:/run/podman/podman.sock
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1g
