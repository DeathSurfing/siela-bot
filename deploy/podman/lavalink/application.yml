# Siela Bot — minimal Lavalink 4 configuration
#
# Sources: SoundCloud (built-in, zero tokens) + optional Spotify via LavaSrc.
# YouTube is disabled. Spotify playback is a mirror: LavaSrc resolves
# metadata and searches SoundCloud for a playable track.
#
# If this Lavalink build does not resolve ${...} placeholders, render this
# file with envsubst in a tiny entrypoint before starting Lavalink.

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    soundcloudFilterOutPreviewTracks: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
    sources:
      spotify: ${SPOTIFY_ENABLED:false}
      youtube: false
      applemusic: false
      deezer: false
      yandexmusic: false
      tidal: false
      qobuz: false
      vkmusic: false
      ytdlp: false
      jiosaavn: false
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "US"
